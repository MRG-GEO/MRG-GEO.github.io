<body>
    <button id="add-project-btn"
        style="margin: 4px; padding: 6px 12px; background:#28a745; color:white;
            border:1px solid #1e7e34; border-radius:4px; cursor:pointer;">
        + Add New Project
    </button>

    <div id="new-project-form" 
        style="display:none; margin-top:10px; padding:10px; border:1px solid #ccc; border-radius:6px;">
    </div>
    <div id="button-bar" style="margin-bottom:10px;"></div>

    <div id="table-container"></div>

    <script src="https://js.arcgis.com/4.31/"></script>
    <script>
        require(["esri/layers/FeatureLayer"], function (FeatureLayer) {
            const projectLayer = new FeatureLayer({
                url: "https://geo-x.apca2.gc.ca/arcserver/rest/services/Hosted/MRG_Geomatics/FeatureServer/1"
            });

            const subTaskLayer = new FeatureLayer({
                url: "https://geo-x.apca2.gc.ca/arcserver/rest/services/Hosted/MRG_Geomatics/FeatureServer/2"
            });

            const fieldMap = {
                "Title": "title",
                "Priority": "priority",
                "Size": "size",
                "Start Date": "start_date",
                "Due Date": "due_date",
                "Description": "description",
                "Project Type": "project_type",
                "Status": "status",
                "Folder Path": "folder_path",
                "Progress": "progress",
                "Last Updated": "last_updated",
            };

            const displayOrder = Object.keys(fieldMap);

            const programButtons = [
                "All",
                "ACS",
                "External Relations",
                "Geomatics Admin",
                "HOU",
                "Law Enforcement",
                "Resource Conservation",
                "Visitor Experience",
                "HES",
                "Assets",
                "National Office",
                "External Requests"
            ];

            const resourceConservationPrograms = [
                "CRM", "EI Monitoring", "Impact Assessment", "Ecosystem Science", "Wildlife", "Veg", "Geomatics Admin"
            ];

            function formatDate(value) {
                if (!value) return "";
                const date = new Date(value);
                if (isNaN(date)) return value;
                const dd = String(date.getDate()).padStart(2, "0");
                const mm = String(date.getMonth() + 1).padStart(2, "0");
                const yyyy = date.getFullYear();
                return `${dd}-${mm}-${yyyy}`;
            }

            function parseDate(str) {
                const [dd, mm, yyyy] = str.split("-");
                if (!dd || !mm || !yyyy) return null;
                return new Date(`${yyyy}-${mm}-${dd}`);
            }

            // --- REBUILD ROWS FUNCTION (used by all tables) ---
            function rebuildTableRows(table, rows) {
                Array.from(table.querySelectorAll("tr:not(:first-child)")).forEach(r => r.remove());

                rows.forEach(feature => {
                    const row = document.createElement("tr");

                    // --- ARROW CELL ---
                    const arrowTd = document.createElement("td");
                    arrowTd.classList.add("arrow-cell");
                    arrowTd.style.width = "28px";
                    arrowTd.style.textAlign = "center";
                    arrowTd.style.cursor = "pointer";
                    arrowTd.style.border = "1px solid #ddd";
                    arrowTd.innerHTML = "&#9654;"; // ► collapsed arrow

                    arrowTd.addEventListener("click", (event) => {
                        event.stopPropagation(); // prevent row click editing a cell
                        toggleSubtaskRow(table, row, feature);
                    });

                    row.appendChild(arrowTd); // important: FIRST cell

                    
                    displayOrder.forEach(label => {
                        const fieldName = fieldMap[label];
                        const td = document.createElement("td");
                        let val = feature.attributes[fieldName];

                        // === PROGRESS BAR ===
                        if (label === "Progress") {
                            const percent = Number(val) || 0;

                            // Choose color based on percent
                            let color;
                            if (percent >= 75) color = "#4caf50"; // green
                            else if (percent >= 50) color = "#ffc107"; // yellow
                            else color = "#ff9800"; // orange

                            td.innerHTML = `
                                <div style="background:#eee;width:100%;height:18px;border-radius:3px;position:relative;">
                                <div style="background:${color};width:${percent}%;height:100%;border-radius:3px;"></div>
                                <div style="position:absolute;top:0;left:0;width:100%;height:100%;text-align:center;
                                    line-height:18px;font-size:12px;font-weight:bold;color:#000;">
                                    ${percent}%
                                </div>
                                </div>`;
                        } else {
                        if (fieldName.includes("date")) val = formatDate(val);
                        td.textContent = val ?? "";

                        // === MAKE CELL EDITABLE ===
                        td.contentEditable = true;
                        td.addEventListener("blur", async () => {
                            let newValue = td.textContent.trim();
                            const objectId = feature.attributes[projectLayer.objectIdField];

                            if (fieldName.includes("date")) {
                            const parsed = parseDate(newValue);
                            if (parsed) newValue = parsed.getTime();
                            }

                            if (newValue == feature.attributes[fieldName]) return;
                            feature.attributes[fieldName] = newValue;

                            try {
                            const result = await projectLayer.applyEdits({ updateFeatures: [feature] });
                            if (result.updateFeatureResults[0].error) {
                                td.style.backgroundColor = "#fdd";
                            } else {
                                td.style.backgroundColor = "#dfd";
                                setTimeout(() => (td.style.backgroundColor = ""), 800);
                            }
                            } catch {
                            td.style.backgroundColor = "#fdd";
                            }
                        });
                        }

                        td.style.border = "1px solid #ddd";
                        td.style.padding = "6px";
                        td.style.overflow = "hidden";
                        td.style.textOverflow = "ellipsis";
                        td.style.whiteSpace = "nowrap";
                        row.appendChild(td);
                    });

                    table.appendChild(row);
                });
            }

            // --- MAIN QUERY ---
            projectLayer.queryFeatures({
                where: "1=1",
                outFields: ["*"],
                returnGeometry: false
            }).then(results => {
                const container = document.getElementById("table-container");
                const buttonBar = document.getElementById("button-bar");
                const allFeatures = results.features;

                // === GROUP FEATURES BY PROGRAM ===
                const programGroups = {
                    "All": allFeatures,
                    "ACS": allFeatures.filter(f => f.attributes.program_function === "ACS"),
                    "Assets": allFeatures.filter(f => f.attributes.program_function === "Assets"),
                    "External Relations": allFeatures.filter(f => f.attributes.program_function === "External Relations"),
                    "Geomatics Admin": allFeatures.filter(f => f.attributes.program_function === "Geomatics Admin"),
                    "HES": allFeatures.filter(f => f.attributes.program_function === "HES"),
                    "HOU": allFeatures.filter(f => f.attributes.program_function === "HOU"),
                    "Resource Conservation": allFeatures.filter(f => resourceConservationPrograms.includes(f.attributes.program_function)),
                    "Visitor Experience": allFeatures.filter(f => f.attributes.program_function === "Visitor Experience"),
                    "Law Enforcement": allFeatures.filter(f => f.attributes.program_function === "Law Enforcement"),
                    "National Office": allFeatures.filter(f => f.attributes.program_function === "National Office"),
                    "External Requests": allFeatures.filter(f => f.attributes.program_function === "External Requests"),
                };

                // === CREATE BUTTONS ===
                programButtons.forEach(program => {
                    const btn = document.createElement("button");
                        btn.textContent = program;
                        btn.style.margin = "4px";
                        btn.style.padding = "6px 12px";
                        btn.style.border = "1px solid #0079c1";
                        btn.style.background = "#0079c1";
                        btn.style.color = "white";
                        btn.style.borderRadius = "4px";
                        btn.style.cursor = "pointer";
                        btn.addEventListener("click", () => showTable(program));
                        btn.addEventListener("mouseover", () => btn.style.background = "#005f9e");
                        btn.addEventListener("mouseout", () => btn.style.background = "#0079c1");
                        buttonBar.appendChild(btn);
                });
                
                document.getElementById("add-project-btn").addEventListener("click", () => {
                    const form = document.getElementById("new-project-form");

                    form.innerHTML = `
                        <h3>Create New Project</h3>
                        <label>Title:<br><input id="np-title"></label><br><br>

                        <label>Project Type:<br>
                            <select id="np-type">
                                <option value="Map Product">Map Product</option>
                                <option value="AGOL App">AGOL App</option>
                                <option value="Field Maps">Field Maps</option>
                                <option value="Survey123">Survey123</option>
                                <option value="Portal App">Portal App</option>
                                <option value="Data Export">Data Export</option>
                                <option value="Data Sharing Agreement">Data Sharing Agreement</option>
                                <option value="Data Collection">Data Collection</option>
                                <option value="Data Management">Data Management</option>
                                <option value="Python Script">Python Script</option>
                            </select>
                        </label><br><br>

                        <label>Priority:<br>
                            <select id="np-priority">
                                <option value="Low">Low</option>
                                <option value="Medium">Medium</option>
                                <option value="High">High</option>
                                <option value="Complete">Complete</option>
                            </select>
                        </label><br><br>

                        <label>Start Date (DD-MM-YYYY):<br>
                            <input id="np-start" type="date">
                        </label><br><br>

                        <label>Due Date (DD-MM-YYYY):<br>
                            <input id="np-due" type="date">
                        </label><br><br>

                        <label>Description:<br>
                            <textarea id="np-desc"></textarea>
                        </label><br><br>

                        <label>Status:<br>
                            <select id="np-status">
                                <option value="Ongoing">Ongoing</option>
                                <option value="Not Started">Not Started</option>
                                <option value="Backlogged">Backlogged</option>
                                <option value="Maintenance">Maintenance</option>
                                <option value="Complete">Complete</option>
                                <option value="Annual">Annual</option>
                            </select>
                        </label><br><br>

                        <label>Size:<br>
                            <select id="np-size">
                                <option value="Small">Small</option>
                                <option value="Medium">Medium</option>
                                <option value="Large">Large</option>
                            </select>
                        </label><br><br>

                        <label>Folder Path:<br>
                            <input id="np-folder">
                        </label><br><br>

                        <label>Progress (%):<br>
                            <input id="np-progress" type="number" min="0" max="100">
                        </label><br><br>

                        <label>Program / Function:<br>
                            <select id="np-program">
                                <option value="ACS">ACS</option>
                                <option value="Assets">Assets</option>
                                <option value="External Relations">External Relations</option>
                                <option value="Geomatics">Geomatics</option>
                                <option value="HES">HES</option>
                                <option value="HOU">HOU</option>
                                <option value="Law Enforcement">Law Enforcement</option>
                                <option value="Visitor Experience">Visitor Experience</option>
                                <option value="ResCon">ResCon</option>
                                <option value="EI Monitoring">EI Monitoring</option>
                                <option value="Impact Assessment">Impact Assessment</option>
                                <option value="Veg">Veg</option>
                                <option value="Ecosystem Science">Ecosystem Science</option>
                                <option value="Wildlife">Wildlife</option>
                                <option value="National Office">National Office</option>
                                <option value="External Requests">External Requests</option>
                            </select>
                        </label><br><br>

                        <button id="np-save"
                            style="background:#0079c1;color:white;padding:6px 12px;">
                            Save Project
                        </button>
                    `;

                    form.style.display = "block";
                });


                // === CREATE TABLES ===
                const tables = {};
                Object.keys(programGroups).forEach(program => {
                    const table = document.createElement("table");
                        table.style.width = "100%";
                        table.style.borderCollapse = "collapse";
                        table.style.tableLayout = "fixed";
                        table.style.marginTop = "10px";
                        table.style.display = "none";

                    // Define sortable fields
                    const sortableFields = ["priority", "start_date", "due_date", "status", "progress"];
                    const sortState = {};

                    // === HEADER ROW ===
                    const headerRow = document.createElement("tr");

                    const arrowHeader = document.createElement("th");
                    arrowHeader.style.width = "28px";
                    arrowHeader.style.backgroundColor = "#0079c1";
                    arrowHeader.style.border = "1px solid #ddd";
                    headerRow.appendChild(arrowHeader);

                    displayOrder.forEach(label => {
                        const th = document.createElement("th");
                        th.textContent = label;
                        th.style.border = "1px solid #ddd";
                        th.style.backgroundColor = "#0079c1";
                        th.style.color = "white";
                        th.style.padding = "6px";
                        th.style.width = "120px";
                        th.style.cursor = sortableFields.includes(fieldMap[label]) ? "pointer" : "default";

                        // Sortable headers
                        if (sortableFields.includes(fieldMap[label])) {
                            const sortIcon = document.createElement("span");
                                sortIcon.textContent = " ⇅";
                                sortIcon.style.fontSize = "12px";
                                sortIcon.style.opacity = "0.7";
                                th.appendChild(sortIcon);

                                th.addEventListener("click", () => {
                                const fieldName = fieldMap[label];
                                const currentDirection = sortState[fieldName] === "asc" ? "desc" : "asc";
                                sortState[fieldName] = currentDirection;

                                programGroups[program].sort((a, b) => {
                                    let valA = a.attributes[fieldName];
                                    let valB = b.attributes[fieldName];

                                    if (fieldName.includes("date")) {
                                        valA = valA ? new Date(valA).getTime() : 0;
                                        valB = valB ? new Date(valB).getTime() : 0;
                                    }

                                    if (!isNaN(valA) && !isNaN(valB)) {
                                        valA = Number(valA);
                                        valB = Number(valB);
                                    }

                                    if (valA < valB) return currentDirection === "asc" ? -1 : 1;
                                    if (valA > valB) return currentDirection === "asc" ? 1 : -1;
                                    return 0;
                                });

                                document.querySelectorAll("th span").forEach(s => s.textContent = " ⇅");
                                sortIcon.textContent = currentDirection === "asc" ? " ▲" : " ▼";

                                rebuildTableRows(table, programGroups[program]);
                            });
                        }

                        headerRow.appendChild(th);
                    });
                    table.appendChild(headerRow);

                    rebuildTableRows(table, programGroups[program]);
                    tables[program] = table;
                    container.appendChild(table);
                });

                // === SHOW TABLE FUNCTION ===
                function showTable(program) {
                    Object.keys(tables).forEach(p => {
                        tables[p].style.display = "none";
                    });
                    tables[program].style.display = "table";
                }

                showTable("All");

                function convertDatePickerToEpoch(inputValue) {
                    if (!inputValue || inputValue.trim() === "") return null; 
                    const [yyyy, mm, dd] = inputValue.split("-");
                    return new Date(Date.UTC(yyyy, mm - 1, dd)).getTime(); // safer
                }

                document.addEventListener("click", async (e) => {
                    if (e.target.id !== "np-save") return;

                    const attrs = {
                        title: document.getElementById("np-title").value,
                        priority: document.getElementById("np-priority").value,
                        start_date: convertDatePickerToEpoch(document.getElementById("np-start").value),
                        due_date: convertDatePickerToEpoch(document.getElementById("np-due").value),
                        description: document.getElementById("np-desc").value,
                        status: document.getElementById("np-status").value,
                        folder_path: document.getElementById("np-folder").value,
                        progress: Number(document.getElementById("np-progress").value) || 0,
                        program_function: document.getElementById("np-program").value
                    };

                    const newFeature = { attributes: attrs };

                    try {
                        const result = await projectLayer.applyEdits({ addFeatures: [newFeature] });

                        if (result.addFeatureResults[0].error) {
                            alert("❌ Error adding project");
                            console.error(result.addFeatureResults[0].error);
                            return;
                        }

                        alert("✅ Project added successfully!");

                        // Reload all features to refresh tables
                        location.reload();

                    } catch (err) {
                        console.error(err);
                        alert("❌ Failed to add project");
                    }
                });

            });
        
            async function toggleSubtaskRow(table, row, feature) {
                const arrow = row.querySelector(".arrow-cell");
                // If subtasks are already shown, remove them
                if (row.nextSibling && row.nextSibling.classList.contains("subtask-row")) {
                    row.nextSibling.remove();
                    arrow.innerHTML = "&#9654;"; // ►
                    return;
                    
                }
                arrow.innerHTML = "&#9660;"; // ▼

                // --- QUERY RELATED SUBTASKS ---
                const parentGlobalID = feature.attributes.globalid;

                const result = await subTaskLayer.queryFeatures({
                    where: `project_ID = '${parentGlobalID}'`,
                    outFields: ["*"],
                    returnGeometry: false
                });

                // --- BUILD SUBTASK EXPANSION ROW ---
                const subRow = document.createElement("tr");
                subRow.classList.add("subtask-row");

                const td = document.createElement("td");
                td.colSpan = displayOrder.length;
                td.style.background = "#f1f1f1";
                td.style.padding = "10px";

                let html = `
                    <div style="margin-bottom:6px; font-weight:bold;">
                        Subtasks (${result.features.length})
                    </div>
                    <table style="width:100%; border-collapse:collapse;">
                        <tr>
                            <th style="border:1px solid #ccc; padding:6px;">Title</th>
                            <th style="border:1px solid #ccc; padding:6px;">Status</th>
                            <th style="border:1px solid #ccc; padding:6px;">Progress</th>
                        </tr>
                `;

                result.features.forEach(sub => {
                    html += `
                        <tr>
                            <td style="border:1px solid #ccc; padding:6px;">${sub.attributes.Title || ""}</td>
                            <td style="border:1px solid #ccc; padding:6px;">${sub.attributes.Status || ""}</td>
                            <td style="border:1px solid #ccc; padding:6px;">${sub.attributes.Progress || 0}%</td>
                        </tr>
                    `;
                });

                html += `</table>`;
                td.innerHTML = html;
                subRow.appendChild(td);

                // Insert directly underneath project row
                row.insertAdjacentElement("afterend", subRow);
            }
        });
  </script>

  <style>
    tr:nth-child(even) td { background: #f9f9f9; }
    td:focus { background-color: #fff3cd; }
  </style>
</body>
